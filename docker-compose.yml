services:
  pop:
    build: ./pop
    container_name: pop
    ports:
      - "8000:8000"     # 호스트에서도 curl/브라우저로 직접 확인하고 싶으면 이 포트로 접근

  client:
    build: ./client
    container_name: client
    depends_on:
      - pop
    environment:
      - POP_URL=http://pop:8000   # docker-compose 네트워크 안에서는 서비스 이름으로 통신
      - SEAT_ID=A1
      - REQUEST_COUNT=3

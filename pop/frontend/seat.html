<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>좌석 선택 - KOREN 공정 티켓팅</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="header">KOREN 공정 티켓팅 - 좌석 선택</div>

  <div class="container">
    <div id="entryBanner" class="timestamp-box" style="display:none;"></div>

    <div class="car-label">KTX 101호 · 5호차</div>

    <div class="legend">
      <span><span class="box available"></span>선택 가능</span>
      <span><span class="box selected"></span>선택됨</span>
      <span><span class="box unavailable"></span>이미 판매됨</span>
    </div>

    <div id="seatMap" class="seat-map"></div>
  </div>

<script>
// 이전 페이지(index.html)에서 넘어온 '예매 진입 시각' 정보를 표시한다.
(function showEntryBanner() {
  const params = new URLSearchParams(window.location.search);
  const entryTimeUtc = params.get('entryTimeUtc');
  const entryId = params.get('entryId');
  if (!entryTimeUtc) return;

  const kst = new Date(entryTimeUtc).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
  const banner = document.getElementById('entryBanner');
  banner.style.display = 'block';
  banner.innerHTML = `
    <div>이 예매 흐름은 PoP에 <b>${entryTimeUtc}</b> (UTC) / <b>${kst}</b> (KST)에 접수되었습니다.</div>
    <div>기록 ID: ${entryId}</div>
  `;
})();

// 지금 단계에서는 좌석 UI만 보여준다.
// 실제 좌석 클릭 -> PoP로 요청 전송 -> 판정 로직은 다음 단계에서 붙일 예정.
const ROWS = 12;
const COLS = ['A', 'B', 'C', 'D'];

// 화면 구성을 확인하기 좋게, 일부 좌석은 미리 "판매됨"으로 표시해둔다 (더미 데이터).
const unavailableSeats = new Set(['3B', '3C', '7A', '9D', '11B']);

const seatMap = document.getElementById('seatMap');

for (let row = 1; row <= ROWS; row++) {
  const rowDiv = document.createElement('div');
  rowDiv.className = 'seat-row';

  // A, B, 통로, C, D 순서로 배치
  const layout = ['A', 'B', 'aisle', 'C', 'D'];

  layout.forEach(col => {
    if (col === 'aisle') {
      const aisle = document.createElement('div');
      aisle.className = 'seat aisle';
      rowDiv.appendChild(aisle);
      return;
    }

    const seatId = `${row}${col}`;
    const seatDiv = document.createElement('div');
    seatDiv.textContent = seatId;
    seatDiv.dataset.seatId = seatId;

    if (unavailableSeats.has(seatId)) {
      seatDiv.className = 'seat unavailable';
    } else {
      seatDiv.className = 'seat available';
      seatDiv.addEventListener('click', () => {
        // 지금은 화면상 선택 표시만 토글한다 (서버 요청은 다음 단계에서 연결).
        document.querySelectorAll('.seat.selected').forEach(s => {
          if (s !== seatDiv) s.className = 'seat available';
        });
        seatDiv.className = seatDiv.className.includes('selected')
          ? 'seat available'
          : 'seat selected';
      });
    }

    rowDiv.appendChild(seatDiv);
  });

  seatMap.appendChild(rowDiv);
}
</script>
</body>
</html>

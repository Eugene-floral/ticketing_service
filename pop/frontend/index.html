<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KOREN 공정 티켓팅</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="header">KOREN 공정 티켓팅</div>

  <div class="container">
    <div class="train-info">
      <h2>KTX 101호 서울 → 부산</h2>
      <p>승차일: 2026-08-10 (월) 09:00 출발</p>
      <p>잔여석: 확인 중...</p>
    </div>

    <button id="bookBtn" class="book-button">좌석 예매하기</button>
    <p id="statusText" class="status-text"></p>
    <div id="timestampBox" class="timestamp-box" style="display:none;"></div>
  </div>

<script>
const btn = document.getElementById('bookBtn');
const statusText = document.getElementById('statusText');
const timestampBox = document.getElementById('timestampBox');

function toKST(isoUtcString) {
  const d = new Date(isoUtcString);
  return d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  statusText.textContent = 'PoP 서버에 요청을 보내는 중...';

  try {
    const res = await fetch('/booking-entry', { method: 'POST' });
    const data = await res.json();

    statusText.textContent = '요청이 PoP 서버에 정상적으로 도착했습니다.';
    timestampBox.style.display = 'block';
    timestampBox.innerHTML = `
      <div>PoP 도착 시각 (UTC): <b>${data.pop_arrival_timestamp}</b></div>
      <div>PoP 도착 시각 (KST): <b>${toKST(data.pop_arrival_timestamp)}</b></div>
      <div>기록 ID: ${data.entry_id}</div>
      <div class="status-text">2초 후 좌석 화면으로 이동합니다...</div>
    `;

    // 이 진입 시각 정보를 좌석 화면에도 그대로 넘겨서 계속 볼 수 있게 한다.
    const params = new URLSearchParams({
      entryTimeUtc: data.pop_arrival_timestamp,
      entryId: data.entry_id,
    });

    setTimeout(() => {
      window.location.href = `/seat.html?${params.toString()}`;
    }, 2000);
  } catch (err) {
    statusText.textContent = 'PoP 서버에 연결할 수 없습니다.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
